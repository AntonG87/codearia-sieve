# Publishes to npm on a version tag (v0.1.1, v0.2.0, ...) using npm trusted
# publishing: no token in secrets, the registry trusts this workflow's OIDC
# identity. Configure it once on npmjs.com → package → Settings → Trusted publisher.
name: publish

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm publish --provenance --access public
