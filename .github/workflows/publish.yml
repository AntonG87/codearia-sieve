# Publishes to npm on a version tag (v0.1.1, v0.2.0, ...) using npm trusted
# publishing: no token in secrets, the registry trusts this workflow's OIDC
# identity. Configure it once on npmjs.com → package → Settings → Trusted publisher.
name: publish

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5+; setup-node ships the npm bundled with Node.
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm test
      - run: npm run build
      # A tag that moves (history rewrite) must not fail on a version that is
      # already in the registry.
      - id: version
        run: |
          V=$(node -p "require('./package.json').version")
          if npm view "codearia-sieve@$V" version >/dev/null 2>&1; then
            echo "already published $V"; echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.version.outputs.skip != 'true'
        run: npm publish --provenance --access public

      # The official MCP Registry holds metadata only and verifies the npm
      # package by its `mcpName`; authentication is this workflow's OIDC identity.
      # The registry reads npm, so wait for the new version to be visible there.
      - name: Wait for npm to serve the new version
        run: |
          V=$(node -p "require('./package.json').version")
          for i in $(seq 1 20); do
            if npm view "codearia-sieve@$V" version >/dev/null 2>&1; then exit 0; fi
            sleep 15
          done
          echo "npm never served $V" && exit 1
      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher
      - name: Set server.json version from the tag
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          jq --arg v "$VERSION" '.version = $v | .packages[0].version = $v' server.json > server.tmp && mv server.tmp server.json
      - run: ./mcp-publisher validate
      - run: ./mcp-publisher login github-oidc
      - run: ./mcp-publisher publish
